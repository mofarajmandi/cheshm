# Image tags are PINNED to exact versions, deliberately.
#
# `stable-tensorrt` and `latest` are moving targets: a `docker compose pull`,
# or any recreate that happens to race a new upstream release, can swap the
# running version out from under a config file that was written for the old
# one. Frigate in particular version-stamps its config (`version:` in
# config/config.yml) and migrates it on a major bump, so an unplanned jump is
# a working system that stops working with no local change to blame.
#
# Verified 2026-09-18: `stable-tensorrt` and `0.18.0-tensorrt` resolve to the
# same digest (sha256:82d7475b...), and frigate-notify `latest` and `v0.5.4`
# to the same digest (sha256:0cdf7e05...), so pinning changed nothing about
# what runs today. It only removes the surprise later.
#
# To upgrade: bump the tag here, read that release's notes for config
# migrations, and commit the two together so the config change and the
# version that needs it land in the same commit.
x-frigate-image: &frigate-image ghcr.io/blakeblackshear/frigate:0.18.0-tensorrt

services:
  # Refuses to let Frigate start unless the NVR disk is really mounted.
  #
  # The hazard this closes is the one CLAUDE.md step 11 calls out: if
  # /mnt/nvr fails to mount, the mountpoint is still there as an empty
  # directory on the 209G OS disk, the bind mount below succeeds against it,
  # and Frigate cheerfully records onto the OS disk instead. Nothing errors.
  # The first symptom is the root filesystem filling up, which takes Docker
  # and everything else down with it -- and by then the real 442G disk has a
  # gap in its footage that cannot be recovered.
  #
  # `df` cannot tell a mounted disk from an empty mountpoint, so the test is a
  # sentinel file that exists only on the real partition. scripts/install-
  # host-hardening.sh creates it, and refuses to do so while /mnt/nvr is
  # unmounted (which would write the sentinel to the OS disk and defeat this).
  #
  # Scope, honestly: this gates `docker compose up`, not a reboot. Containers
  # with a restart policy are started by the daemon on boot without consulting
  # depends_on, so on an unattended reboot this guard does NOT run. The
  # RequiresMountsFor= drop-in installed by that same script is what covers
  # the boot path. This is the second lock, for the case where the host
  # hardening has not been installed yet or the disk was remounted by hand.
  #
  # It reuses the pinned Frigate image so it pulls nothing extra.
  nvr-mount-guard:
    image: *frigate-image
    container_name: nvr-mount-guard
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        if [ -f /media/frigate/.nvr-disk ]; then
          echo "nvr-mount-guard: /mnt/nvr is mounted, Frigate may start."
          exit 0
        fi
        echo "nvr-mount-guard: REFUSING TO START FRIGATE." >&2
        echo "  /media/frigate/.nvr-disk is missing, which means the host's" >&2
        echo "  /mnt/nvr is NOT the NVR partition -- it is an empty directory" >&2
        echo "  on the OS disk. Starting Frigate now would record onto the OS" >&2
        echo "  disk until it fills." >&2
        echo "  Fix: mount /mnt/nvr, confirm with 'mountpoint /mnt/nvr', then" >&2
        echo "  re-run 'docker compose up -d'." >&2
        exit 1
    volumes:
      - /mnt/nvr:/media/frigate

  frigate:
    container_name: frigate
    image: *frigate-image
    restart: unless-stopped
    depends_on:
      nvr-mount-guard:
        condition: service_completed_successfully
    shm_size: "256mb" # bump this later if Frigate logs a shared-memory warning
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      FRIGATE_RTSP_USER: ${CAMERA_RTSP_USER}
      FRIGATE_RTSP_PASS: ${CAMERA_RTSP_PASS}
      FRIGATE_CAMERA_IP: ${CAMERA_IP}
    ports:
      - "5000:5000" # older/internal UI
      - "8971:8971" # authenticated UI (Frigate 0.14+)
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      # Mount the NVR disk at Frigate's media ROOT, not at recordings/.
      # /media/frigate holds recordings/, clips/ and exports/ -- mounting one
      # level deeper left clips/ (review previews, event thumbs, snapshots) on
      # the container's writable overlay layer: it consumed the 209G OS disk
      # instead of this 442G one, and was destroyed on every container
      # recreate. In-container paths are unchanged by this, so the paths
      # stored in frigate.db (recordings.path, previews.path,
      # reviewsegment.thumb_path) stay valid -- the host data was moved to
      # match, into /mnt/nvr/recordings and /mnt/nvr/clips.
      - /mnt/nvr:/media/frigate

  frigate-notify:
    container_name: frigate-notify
    image: ghcr.io/0x2142/frigate-notify:v0.5.4
    restart: unless-stopped
    depends_on:
      - frigate
    environment:
      # This image has no /etc/localtime (it's a scratch image -- no shell, no
      # coreutils), so Go's time.Local fell back to UTC and every Telegram
      # alert was stamped in UTC. It does ship full tzdata at
      # /usr/share/zoneinfo, so setting TZ is enough; no mount needed. Frigate
      # itself gets this from its /etc/localtime mount instead.
      TZ: America/Halifax
      # Frigate's own admin login, so frigate-notify can poll its API --
      # NOT the camera's RTSP/ONVIF credentials.
      FN_FRIGATE__USERNAME: ${FRIGATE_ADMIN_USER}
      FN_FRIGATE__PASSWORD: ${FRIGATE_ADMIN_PASSWORD}
      FN_ALERTS__TELEGRAM__TOKEN: ${TELEGRAM_BOT_TOKEN}
      FN_ALERTS__TELEGRAM__CHATID: ${TELEGRAM_CHAT_ID}
    volumes:
      - ./frigate-notify/config.yml:/app/config.yml
