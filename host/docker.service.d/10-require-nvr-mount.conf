# Installed to /etc/systemd/system/docker.service.d/ by
# scripts/install-host-hardening.sh. Kept in the repo so the host's
# configuration is version-controlled alongside everything else.
#
# This is the boot-path half of the /mnt/nvr guard (runbook step 11, item 3).
#
# Pairs with `nofail` on the /mnt/nvr line in /etc/fstab. The two are only
# correct together, and the reasoning is worth keeping:
#
#   fstab `defaults` alone: a disk that fails to mount drops the boot into
#   emergency mode. The host never comes up, so it is unreachable even over
#   Tailscale -- and this machine is headless, so that means a physical trip
#   with a keyboard.
#
#   fstab `nofail` alone: the host boots and is reachable, but /mnt/nvr is now
#   an empty directory on the OS disk, and Frigate records onto it until the
#   209G root fills. Worse than the first case, because it is silent and it
#   takes Docker down with it when the disk fills.
#
#   `nofail` + this drop-in: the host boots and is reachable, and Docker --
#   and therefore Frigate -- simply does not start until /mnt/nvr is really
#   mounted. Degraded, diagnosable, and no footage written to the wrong disk.
#
# RequiresMountsFor gates the whole Docker daemon, not just Frigate. That is
# deliberate and acceptable here: this host runs Docker only for Frigate and
# frigate-notify. If that ever stops being true, move this dependency onto a
# per-container systemd unit instead.

[Unit]
RequiresMountsFor=/mnt/nvr
