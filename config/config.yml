# Credentials are injected as container env vars (FRIGATE_RTSP_USER,
# FRIGATE_RTSP_PASS, FRIGATE_CAMERA_IP) via docker-compose.yml, which reads
# them from .env. Nothing sensitive lives in this file.
#
# Retention (Step 07) maps the original 3-tier plan (continuous 7d / motion
# 30d / alerts 60d) onto Frigate 0.14+'s 4-tier record schema:
#   continuous -> continuous.days, motion -> motion.days,
#   alerts -> alerts.retain.days. `detections` wasn't part of the original
# plan, set to 30d (same as motion) as a sensible default.

mqtt:
  enabled: false
  host: 127.0.0.1

detectors:
  onnx:
    type: onnx

model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolo.onnx
  labelmap_path: /labelmap/coco-80.txt

record:
  enabled: true
  continuous:
    days: 7
  motion:
    days: 30
  alerts:
    pre_capture: 5
    post_capture: 5
    retain:
      days: 60
      mode: all
  detections:
    pre_capture: 5
    post_capture: 5
    retain:
      days: 30
      mode: motion

cameras:
  cam1: # rename to something meaningful once you've picked a spot for it
    onvif:
      host: '{FRIGATE_CAMERA_IP}'
      port: 2020
      user: '{FRIGATE_RTSP_USER}'
      password: '{FRIGATE_RTSP_PASS}'
    ffmpeg:
      inputs:
        - path: 
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@{FRIGATE_CAMERA_IP}:554/stream2
          input_args: preset-rtsp-generic
          roles:
            - detect
        - path: 
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@{FRIGATE_CAMERA_IP}:554/stream1
          input_args: preset-rtsp-generic
          roles:
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
version: 0.18-0

# Global, so cameras 2 and 3 inherit it when they're added. Frigate's default
# is ["person"] only. These four are all in the coco-80 labelmap the yolov9-s
# model uses (person=0, bird=14, cat=15, dog=16).
#
# This does NOT add Telegram noise: review.alerts.labels is left at its default
# ["person", "car"], so dog/cat/bird are categorized as *detection* severity
# (frigate/review/maintainer.py), and frigate-notify drops those via
# notify_detections: false. They do get folded into an alert if they share the
# frame with a person. Detector cost is unchanged -- the model already infers
# all 80 classes every frame, `track` only filters which results are kept.
objects:
  track:
    - person
    - cat
    - dog
    - bird

# jsmpeg live view in the web UI only -- not recordings, detection, or RTSP.
# Scale is 1 (best) to 31 (worst), default 8, so this is slightly higher
# quality at the cost of a little CPU and bandwidth while viewing live.
live:
  quality: 6

# Global, so cameras 2 and 3 inherit it. Without this, every event only had a
# 175x175 thumbnail crop; a snapshot is the full 1280x720 detect frame, so the
# UI's Events/Explore views and /api/events/<id>/snapshot.jpg (which used to
# 404 on everything) now have a real image to show.
#
# Stored clean at /media/frigate/clips/<camera>-<event_id>-clean.webp -- the
# bounding box, timestamp and crop options are applied at *render* time, not
# baked into the stored file, so the UI and frigate-notify can each request
# different overlays of the same image.
#
# Defaults left alone: quality 60 (measured ~15.5KB per snapshot on this
# camera) and retain.default 10 days. At ~430 events/day that's ~68MB steady
# state, which is nothing against 409GB free. This only lives on the NVR disk
# because of the /media/frigate mount fix; before that it would have gone to
# the OS disk and been wiped on every container recreate.
#
# Note this is NOT a fallback for an in-progress event: has_snapshot is only
# populated when an event ends (frigate/track/object_processing.py), and
# frigate-notify only fetches a snapshot when has_snapshot is true. The
# text-only-alert fix is recheck_delay in frigate-notify/config.yml, not this.
# Revisit required_zones here once Step 08 lands.
snapshots:
  enabled: true
